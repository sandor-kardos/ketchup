<style>
/* Layout: portrait phone column (max 560px) on every screen; flat surfaces, no borders or shadows; every choice is a swipeable pill row */
:root{
  --bg:#F7F4F2; --surface:#FFFFFF; --soft:#EFEAE7; --ink:#1E1716; --muted:#6B5F5C;
  --brand:#D7261E; --on-brand:#FFFFFF; --brand-soft:#FDE2DF; --accent:#FFB400; --on-accent:#1A1A1A;
  --warn:#B45309; --warn-soft:#FFEDD5;
  --c-now:#FDE2DF; --c-dec:#FFF0C2; --c-ai:#EFEAE7; --c-q:#E4E7FB; --c-goal:#FFB400;
  --font-display: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141011; --surface:#201A1B; --soft:#2E2526; --ink:#F6EEEC; --muted:#B5A6A3;
  --brand:#FF6B5E; --on-brand:#1A0F10; --brand-soft:#3A1F22; --accent:#FFB400; --on-accent:#1A1A1A;
  --warn:#FBBF24; --warn-soft:#3A2A12; --c-now:#3A1F22; --c-dec:#3A3014; --c-ai:#2E2526; --c-q:#262A4A; --c-goal:#FFB400; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141011; --surface:#201A1B; --soft:#2E2526; --ink:#F6EEEC; --muted:#B5A6A3;
  --brand:#FF6B5E; --on-brand:#1A0F10; --brand-soft:#3A1F22; --accent:#FFB400; --on-accent:#1A1A1A;
  --warn:#FBBF24; --warn-soft:#3A2A12; --c-now:#3A1F22; --c-dec:#3A3014; --c-ai:#2E2526; --c-q:#262A4A; --c-goal:#FFB400; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding-block:10px 32px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:18px;font-weight:800}
h3{font-size:15px;font-weight:800}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* pills: one component for every choice */
.pills{display:flex;gap:8px;overflow-x:auto;align-self:stretch;min-width:0;width:auto;touch-action:pan-x pan-y;overscroll-behavior-x:contain;scroll-snap-type:x proximity;margin-inline:-16px;padding:2px 16px 6px;scroll-padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--soft);color:var(--ink);
  padding:0 14px;min-height:38px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;max-width:78vw}
.pill .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill[aria-pressed="true"],.pill[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}
.pill .cnt{background:var(--surface);color:var(--ink);border-radius:999px;font-size:13px;padding:1px 8px;min-width:24px;text-align:center}
.pill[aria-pressed="true"] .cnt{background:var(--on-brand);color:var(--brand)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.pill.chip{cursor:default;padding:0 4px 0 12px;background:var(--surface)}
.pill.chip .lbl{max-width:42vw}
.pill.chip .x{border:0;background:var(--soft);color:var(--ink);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;margin-left:2px}
.pill.chip .x svg{width:16px;height:16px}
.pill.static{cursor:default;min-height:28px;padding:0 10px;font-size:12px}
.pill.go{background:var(--accent);color:var(--on-accent)}
.pill.ghosty{background:transparent;box-shadow:inset 0 0 0 2px var(--soft)}
.pill svg.i{width:18px;height:18px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:19px}
.logo svg{width:30px;height:30px}
header .pills{margin:0;padding:0;overflow:visible;align-self:auto}

.hero{display:flex;flex-direction:column;gap:10px}
.hero .art{width:100%;max-width:100%;height:auto;display:block;border-radius:24px;background:var(--brand-soft)}
.lead{font-size:17px;color:var(--muted);font-weight:700}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feat{border:0;background:var(--surface);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;min-height:56px}
.feat .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.feat strong{font-family:var(--font-display);font-size:14px;line-height:1.15}
.feat[aria-expanded="true"]{background:var(--brand);color:var(--on-brand)}
.feat[aria-expanded="true"] .ic{background:var(--on-brand);color:var(--brand)}
.bubble{grid-column:1/-1;position:relative;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;font-size:14px;margin-top:4px}
.bubble::before{content:"";position:absolute;top:-7px;width:14px;height:14px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
.bubble.l::before{left:24%}.bubble.r::before{left:72%}

.card{background:var(--surface);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px}

.drop{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;border-radius:24px;background:var(--surface);padding:20px 16px;transition:background .15s}
.drop.over{background:var(--brand-soft)}
.drop .big{width:56px;height:56px;border-radius:18px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.drop .big svg{width:32px;height:32px}
.drop h1{text-align:center}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:start;gap:4px;width:100%}
.flow li{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.flow .ic{width:36px;height:36px;border-radius:12px;background:var(--soft);color:var(--brand);display:grid;place-items:center}
.flow .ic svg{width:20px;height:20px}
.flow .arr{color:var(--muted);padding-top:8px}
.flow .arr svg{width:16px;height:16px}
.drop textarea{width:100%;border:0;border-radius:16px;padding:12px 14px;background:var(--soft);min-height:84px;resize:vertical;text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:0 18px;min-height:48px;font-weight:800;font-size:16px;cursor:pointer;width:100%}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{font-weight:700;min-height:1.4em;text-align:center}
.status.err{color:var(--warn)}
.how ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.how .note{font-size:14px;color:var(--muted)}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;min-height:44px}
details>summary::-webkit-details-marker{display:none}
details>summary .chev{margin-left:auto;transition:transform .15s}
details[open]>summary .chev{transform:rotate(180deg)}

.more{background:var(--brand-soft);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.more strong{font-family:var(--font-display);font-size:17px}

.merge{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:20px;padding:10px 10px 10px 14px}
.merge .txt{flex:1;min-width:0;font-size:15px}
.merge .txt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.iconbtn.go{background:var(--accent);color:var(--on-accent)}

.titlewrap{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:0 12px}
.titlewrap input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--font-display);font-weight:800;font-size:17px;padding:9px 0}
.titlewrap svg{color:var(--muted)}
.pv{display:flex;flex-direction:column;gap:8px}
.pv .sec{border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px;overflow-wrap:anywhere}
.pv .sec.intro{background:var(--soft)}
.pv .sec.now{background:var(--c-now)} .pv .sec.dec{background:var(--c-dec)} .pv .sec.ai{background:var(--c-ai)} .pv .sec.q{background:var(--c-q)} .pv .sec.src{background:transparent;padding:4px 2px;color:var(--muted);font-size:13px}
.pv .sec.goal{background:var(--surface);box-shadow:inset 0 0 0 3px var(--c-goal)}
.pv .tag{align-self:flex-start;font:800 11px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--surface);color:var(--ink)}
.pv .sec.goal .tag{background:var(--c-goal);color:var(--on-accent)}
.pv h4{margin:0;font:800 17px/1.2 var(--font-display)}
.pv ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.pv blockquote{margin:0;padding-left:10px;border-left:3px solid currentColor;opacity:.85}
.pv p{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:700}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
textarea.pack{width:100%;min-height:200px;border:0;border-radius:16px;padding:12px;background:var(--soft);font-family:var(--font-mono);font-size:13px;line-height:1.5;resize:vertical}
.actions{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center}
input.goal{width:100%;border:0;border-radius:14px;padding:11px 12px;background:var(--soft)}
.actions .btn{width:auto}
.toast{font-weight:700;color:var(--brand);min-height:1.3em;text-align:center}
.chatlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.chatlist li{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:14px;padding:10px 12px}
.chatlist .t{font-weight:700;overflow-wrap:anywhere}
.chatlist select{border:0;border-radius:10px;padding:8px;background:var(--surface);min-height:40px;width:100%}

.post{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.post .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post .pills{margin-inline:0;padding:0}
form.share{display:flex;flex-direction:column;gap:10px}
form.share input,form.share textarea{border:0;border-radius:14px;padding:12px;background:var(--soft);width:100%}
form.share textarea{min-height:120px;resize:vertical}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.check input{width:24px;height:24px;flex:none;margin:0}
.warnline{font-size:14px;color:var(--warn);display:flex;gap:6px;align-items:flex-start}
.safe{display:flex;flex-direction:column;gap:10px}
.safe li{display:flex;gap:10px;align-items:flex-start}
.safe ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.safe .ic{width:36px;height:36px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
footer{font-size:14px;color:var(--muted);text-align:center}
.panel{display:flex;flex-direction:column;gap:16px}
.panel[hidden]{display:none}
.center{min-height:calc(100svh - 150px - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;gap:10px}
.results{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.art{width:100%;height:auto;max-height:120px;display:block;border-radius:22px;background:var(--brand-soft)}
.ibtn{border:0;background:var(--soft);color:var(--muted);width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;flex:none;font:700 13px/1 var(--font-display)}
.ibtn[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.hrow{display:flex;align-items:center;gap:8px}
.tip{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;font-size:13px;position:relative;margin-top:2px}
.tip::before{content:"";position:absolute;top:-6px;left:18px;width:12px;height:12px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:92svh;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--soft);align-self:center}
.sharecard{background:var(--surface);border:3px solid var(--brand);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.sharecard .brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:15px}
.sharecard .brand svg{width:26px;height:26px}
.sharecard h3{font-size:19px}
.sharecard .txt{font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.sharecard .foot{font-size:12px;color:var(--muted)}
.social{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.social a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:700;background:var(--surface);border-radius:14px;padding:10px 4px}
.social a span.b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font:800 14px/1 var(--font-display)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font:800 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:700}
.tile.hero{grid-column:1/-1;background:var(--brand);color:var(--on-brand)}
.tile.hero span{color:var(--on-brand);opacity:.85}
.tile.hero b{font-size:34px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:72px 1fr 44px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.hbar .track{height:14px;border-radius:7px;background:var(--soft);overflow:hidden}
.hbar .fill{height:100%;border-radius:7px;background:var(--brand)}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;align-items:end;height:120px;border-bottom:1px solid var(--soft);padding-top:16px}
.col{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.col .bar{background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.col .bar.zero{background:var(--soft)}
.col:hover .bar,.col:focus .bar{background:var(--accent)}
.col .tt{position:absolute;bottom:calc(100% - 14px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;padding:3px 6px;border-radius:6px;white-space:nowrap;display:none;z-index:2}
.col:hover .tt,.col:focus .tt{display:block}
.collabels{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;font-size:10px;color:var(--muted);text-align:center;font-weight:700}
.chartcard{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chartcard h3{font-size:14px}
.fact{background:var(--c-dec);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:700}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;min-height:52px;justify-content:center;cursor:pointer;border-radius:14px}
.tabbar button[aria-current="page"]{color:var(--brand)}
.tabbar button[aria-current="page"] svg{background:var(--brand-soft);border-radius:999px;padding:3px 14px;width:52px;height:30px}
.tabbar svg.i{width:24px;height:24px}
@media (min-width:600px){ body{font-size:16px} .wrap{padding-block:16px 24px} h1{font-size:26px} h2{font-size:20px} .tabbar{max-width:520px;margin:0 auto;border-radius:22px 22px 0 0} }
/* desktop: top bar (logo, tabs, language), wider column, centred dialog, wrapping pills */
@media (min-width:900px){
  body{padding-top:84px;padding-bottom:40px}
  .wrap{max-width:820px;gap:24px;padding-top:8px}
  header.top{position:fixed;top:0;left:0;right:0;z-index:25;height:64px;background:var(--surface);padding-inline:max(24px,calc((100vw - 1040px)/2))}
  .tabbar{top:0;bottom:auto;left:50%;right:auto;transform:translateX(-50%);height:64px;width:auto;max-width:none;margin:0;padding:0;background:transparent;border-radius:0;
    grid-template-columns:repeat(4,auto);gap:6px;align-items:center;z-index:26}
  .tabbar button{flex-direction:row;gap:8px;min-height:44px;padding:0 16px;font-size:15px;border-radius:999px}
  .tabbar button:hover{background:var(--soft)}
  .tabbar button[aria-current="page"]{background:var(--brand-soft)}
  .tabbar button[aria-current="page"] svg{background:none;padding:0;width:24px;height:24px;border-radius:0}
  .center{min-height:calc(100vh - 200px)}
  .pills{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0;scroll-snap-type:none}
  .pill{max-width:100%}
  .pill:hover:not([aria-pressed="true"]):not([aria-selected="true"]):not(.static){filter:brightness(.96)}
  .feat:hover{filter:brightness(.97)}
  .sheet-bg{align-items:center;padding:24px}
  .sheet{border-radius:24px;max-width:560px;padding:24px}
  .sheet .grab{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">

<script id="core">
/* ---------- Core logic (pure, no DOM) ---------- */
var Core = (function(){
  var STOP = new Set(("a az egy és is hogy nem de ha meg mert vagy volt lesz van már még csak mint mit mi ez azt ezt itt ott akkor is így úgy kell lehet nincs sem fel le be ki el rá rám neki nekem nekünk tudsz tudod tudnál szeretném szeretnék kérlek köszi köszönöm légyszi légy szia hello helló ok oké igen jó jól nagyon minden mindig most aztán majd sok kis nagy egy két három van-e lenne legyen-e amit ami amely amikor ahol hol mikor miért hogyan hány milyen melyik vele velem neked nektek ezzel azzal ebben abban erre arra ezt azt the and for you your with that this are was were have has had not but can could would should will just what how why when where which who into from about there their them they then than also more most some any all one two our out its it's i'm i've i'd i'll me my we us he she his her him an to of in on at by as or so if is be it do does did no yes ok okay please thanks thank hi hey get got make like want need use using used").split(/\s+/));
  var DECIDE = /(^legyen\s|eldöntöttem|döntöttem|úgy döntöttem|legyen a|legyen az|maradjunk|választom|választottam|megyünk|megveszem|végleges|a végleges|i decided|we decided|decided to|let'?s go with|i'?ll go with|going with|i chose|i'?ll use|we'?ll use|i will use|final answer|final decision)/i;
  var AISUG = /(javaslom|azt ajánlom|érdemes|ajánlott|i recommend|i'?d suggest|i suggest|you should|the best option|consider using)/i;

  function stripHtml(h){ return String(h||"").replace(/<br\s*\/?>/gi,"\n").replace(/<\/p>/gi,"\n").replace(/<[^>]+>/g,"")
    .replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim(); }

  function parseChatGPT(arr){
    return arr.map(function(c){
      var msgs=[]; var map=c.mapping||{};
      Object.keys(map).forEach(function(k){
        var m=map[k]&&map[k].message; if(!m||!m.content) return;
        var role=m.author&&m.author.role; if(role!=="user"&&role!=="assistant") return;
        var parts=(m.content.parts||[]).filter(function(p){return typeof p==="string";});
        var text=parts.join("\n").trim(); if(!text) return;
        msgs.push({role:role==="user"?"user":"ai",text:text,t:(m.create_time||c.create_time||0)*1000});
      });
      msgs.sort(function(a,b){return a.t-b.t;});
      var start=(c.create_time||0)*1000, end=(c.update_time||c.create_time||0)*1000;
      return {src:"ChatGPT",title:c.title||"",start:start,end:end,msgs:msgs};
    }).filter(function(c){return c.msgs.length;});
  }
  function parseClaude(arr){
    return arr.map(function(c){
      var msgs=(c.chat_messages||[]).map(function(m){
        var text=m.text||(m.content||[]).filter(function(x){return x&&x.type==="text";}).map(function(x){return x.text;}).join("\n");
        return {role:m.sender==="human"?"user":"ai",text:String(text||"").trim(),t:Date.parse(m.created_at)||0};
      }).filter(function(m){return m.text;});
      return {src:"Claude",title:c.name||"",start:Date.parse(c.created_at)||0,end:Date.parse(c.updated_at||c.created_at)||0,msgs:msgs};
    }).filter(function(c){return c.msgs.length;});
  }
  function parseGemini(arr){
    var ev=arr.filter(function(e){
      var h=(e.header||"")+" "+(e.products||[]).join(" ");
      return /gemini|bard/i.test(h);
    }).map(function(e){
      var prompt=String(e.title||"").replace(/^\s*(prompted|promptként megadva|megadott prompt|kérdezte)[:\s]*/i,"").trim();
      var resp=(e.safeHtmlItem||[]).map(function(x){return stripHtml(x.html);}).join("\n").trim();
      return {t:Date.parse(e.time)||0,prompt:prompt,resp:resp};
    }).filter(function(e){return e.prompt;}).sort(function(a,b){return a.t-b.t;});
    var chats=[],cur=null;
    ev.forEach(function(e){
      if(!cur||e.t-cur.end>45*60000){ cur={src:"Gemini",title:e.prompt.slice(0,70),start:e.t,end:e.t,msgs:[]}; chats.push(cur); }
      cur.msgs.push({role:"user",text:e.prompt,t:e.t});
      if(e.resp) cur.msgs.push({role:"ai",text:e.resp,t:e.t+1});
      cur.end=e.t;
    });
    return chats;
  }
  var USER_L=/^\s*(you said|you|human|user|me|én|te|ezt írtad|ezt mondtad)\s*:?\s*$/i;
  var AI_L=/^\s*(chatgpt said|chatgpt|claude said|claude|gemini said|gemini|assistant|ai|asszisztens)\s*:?\s*$/i;
  var USER_P=/^\s*(you|human|user|me|én)\s*:\s+/i, AI_P=/^\s*(chatgpt|claude|gemini|assistant|ai)\s*:\s+/i;
  function parseText(text,fallbackSrc,now){
    text=String(text||"").replace(/\r/g,"").trim(); if(text.length<20) return [];
    var src=/chatgpt said|^\s*chatgpt\s*:/im.test(text)?"ChatGPT":/^\s*claude\s*:?\s*$|claude said/im.test(text)?"Claude":/^\s*gemini\s*:?\s*$|gemini said|show thinking/im.test(text)?"Gemini":(fallbackSrc||"Pasted");
    var lines=text.split("\n"), msgs=[], cur=null, t=now||Date.now(), marked=false;
    lines.forEach(function(ln){
      var role=null, rest=ln;
      if(USER_L.test(ln)){role="user";rest="";} else if(AI_L.test(ln)){role="ai";rest="";}
      else if(USER_P.test(ln)){role="user";rest=ln.replace(USER_P,"");} else if(AI_P.test(ln)){role="ai";rest=ln.replace(AI_P,"");}
      if(role){marked=true;cur={role:role,text:rest,t:t+msgs.length};msgs.push(cur);return;}
      if(!cur){cur={role:"user",text:"",t:t};msgs.push(cur);}
      cur.text+=(cur.text?"\n":"")+ln;
    });
    msgs=msgs.map(function(m){return {role:m.role,text:m.text.trim(),t:m.t};}).filter(function(m){return m.text;});
    if(!msgs.length) return [];
    var firstUser=(msgs.find(function(m){return m.role==="user";})||msgs[0]).text;
    var title=firstUser.split("\n").find(function(l){return l.trim();})||"";
    return [{src:src,title:title.trim().slice(0,70),start:t,end:t+msgs.length,msgs:msgs,pasted:true,marked:marked}];
  }
  function parseJSON(name,data){
    if(data&&!Array.isArray(data)){ data=data.conversations||data.chats||data.items||[data]; }
    if(!Array.isArray(data)||!data.length) return [];
    var f=data[0]||{};
    if(f.mapping) return parseChatGPT(data);
    if(f.chat_messages) return parseClaude(data);
    if(f.header||f.products) return parseGemini(data);
    return [];
  }

  function stem(w){ return w.length>7?w.slice(0,7):w; }
  function tokens(text){
    var out=[]; var m=String(text).toLowerCase().match(/[\p{L}\p{N}][\p{L}\p{N}'-]*/gu)||[];
    m.forEach(function(w){ w=w.replace(/^['-]+|['-]+$/g,""); if(w.length<2||STOP.has(w)||/^\d+$/.test(w)) return; out.push(w); });
    return out;
  }
  function docText(c){
    var u=c.msgs.filter(function(m){return m.role==="user";}).map(function(m){return m.text;}).join(" ").slice(0,4000);
    var a=c.msgs.filter(function(m){return m.role==="ai";}).map(function(m){return m.text;}).join(" ").slice(0,1500);
    return (c.title+" ").repeat(3)+u+" "+a;
  }
  function norm(v){ var s=0; for(var k in v) s+=v[k]*v[k]; s=Math.sqrt(s)||1; var o={}; for(var k2 in v) o[k2]=v[k2]/s; return o; }
  function cos(a,b){ var s=0; var x=a,y=b; if(Object.keys(a).length>Object.keys(b).length){x=b;y=a;} for(var k in x) if(y[k]) s+=x[k]*y[k]; return s; }

  function group(chats, threshold){
    var T=threshold||0.16, N=chats.length;
    var surface={}, tfs=[], df={};
    chats.forEach(function(c){
      var tf={}; tokens(docText(c)).forEach(function(w){ var s=stem(w); tf[s]=(tf[s]||0)+1; surface[s]=surface[s]||{}; surface[s][w]=(surface[s][w]||0)+1; });
      tfs.push(tf); Object.keys(tf).forEach(function(s){ df[s]=(df[s]||0)+1; });
    });
    var maxDf=N>10?Math.max(3,Math.floor(N*0.4)):N+1;
    var vecs=tfs.map(function(tf){
      var v={}; for(var s in tf){ if(df[s]>=maxDf) continue; v[s]=(1+Math.log(tf[s]))*(Math.log((N+1)/(df[s]+1))+1); } return norm(v);
    });
    var order=chats.map(function(_,i){return i;}).sort(function(a,b){return chats[a].start-chats[b].start;});
    var clusters=[];
    order.forEach(function(i){
      var best=-1,bs=0;
      clusters.forEach(function(cl,ci){ var s=cos(vecs[i],norm(cl.sum)); if(s>bs){bs=s;best=ci;} });
      if(best>=0&&bs>=T){ var cl=clusters[best]; cl.ids.push(i); for(var k in vecs[i]) cl.sum[k]=(cl.sum[k]||0)+vecs[i][k]; }
      else { var sum={}; for(var k2 in vecs[i]) sum[k2]=vecs[i][k2]; clusters.push({ids:[i],sum:sum}); }
    });
    function label(sum){
      return Object.keys(sum).sort(function(a,b){return sum[b]-sum[a];}).slice(0,3).map(function(s){
        var f=surface[s]||{}; return Object.keys(f).sort(function(a,b){return f[b]-f[a];})[0]||s;
      }).join(", ");
    }
    var topics=clusters.map(function(cl,ix){
      var first=cl.ids.map(function(i){return chats[i];}).filter(function(c){return c.title;}).sort(function(a,b){return a.start-b.start;})[0];
      var lab=first&&cl.ids.length>1?first.title.slice(0,60):(first?first.title.slice(0,60):label(cl.sum));
      return {id:"t"+ix,name:lab.charAt(0).toUpperCase()+lab.slice(1),idx:cl.ids,vec:norm(cl.sum)};
    });
    var merges=[];
    for(var a=0;a<topics.length;a++) for(var b=a+1;b<topics.length;b++){
      var s=cos(topics[a].vec,topics[b].vec); if(s>=0.08&&s<T+0.06) merges.push({a:topics[a].id,b:topics[b].id,sim:s});
    }
    merges.sort(function(x,y){return y.sim-x.sim;});
    return {topics:topics,merges:merges.slice(0,5),vecs:vecs};
  }

  function sentences(text){
    return String(text).split(/(?<=[.!?])\s+|\n+/).map(function(s){return s.replace(/^[-*#>\s]+/,"").trim();}).filter(function(s){return s.length>=8&&s.length<=260;});
  }
  function fmtDate(t){ if(!t) return "?"; var d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function clip(s,n){ s=String(s).replace(/\s+/g," ").trim(); return s.length>n?s.slice(0,n-1)+"…":s; }

  function digest(chats){
    var cs=chats.slice().sort(function(a,b){return a.end-b.end;});
    var newest=cs[cs.length-1];
    var decisions=[],ai=[],questions=[],seen=new Set();
    cs.slice().reverse().forEach(function(c,ri){
      c.msgs.forEach(function(m){
        sentences(m.text).forEach(function(s){
          var key=s.toLowerCase(); if(seen.has(key)) return;
          if(m.role==="user"&&DECIDE.test(s)){ seen.add(key); decisions.push({t:m.t||c.end,src:c.src,s:s}); }
          else if(m.role==="ai"&&AISUG.test(s)){ seen.add(key); ai.push({t:m.t||c.end,src:c.src,s:s}); }
          else if(m.role==="user"&&ri<2&&/\?$/.test(s)){ seen.add(key); questions.push({t:m.t||c.end,src:c.src,s:s}); }
        });
      });
    });
    var byNew=function(a,b){return b.t-a.t;};
    var lastUser=newest.msgs.filter(function(m){return m.role==="user";}).pop();
    var lastAi=newest.msgs.filter(function(m){return m.role==="ai";}).pop();
    return {
      start:cs[0].start, end:newest.end, count:cs.length,
      srcs:Array.from(new Set(cs.map(function(c){return c.src;}))),
      newest:{src:newest.src,title:newest.title,end:newest.end,user:lastUser?clip(lastUser.text,500):"",ai:lastAi?clip(lastAi.text,350):""},
      decisions:decisions.sort(byNew).slice(0,12),
      aiSuggestions:ai.sort(byNew).slice(0,5),
      questions:questions.sort(byNew).slice(0,6),
      sources:cs.slice().reverse().map(function(c){return {date:fmtDate(c.start),src:c.src,title:c.title||"(untitled)"};})
    };
  }

  function summaryMd(topicName,d,L){
    var o=[];
    o.push("# "+topicName);
    o.push("_"+fmtDate(d.start)+" → "+fmtDate(d.end)+" · "+d.count+" "+L.chatsWord+" · "+d.srcs.join(", ")+"_");
    o.push(""); o.push("## "+L.mdLatest);
    o.push(L.mdLatestLine.replace("{date}",fmtDate(d.newest.end)).replace("{src}",d.newest.src).replace("{title}",d.newest.title));
    if(d.newest.user) o.push("> "+d.newest.user);
    if(d.newest.ai){ o.push(""); o.push(L.mdAiLast); o.push("> "+d.newest.ai); }
    o.push(""); o.push("## "+L.mdDecisions);
    if(d.decisions.length) d.decisions.forEach(function(x){o.push("- ("+fmtDate(x.t)+", "+x.src+") "+x.s);}); else o.push("- "+L.mdNone);
    if(d.aiSuggestions.length){ o.push(""); o.push("## "+L.mdAi); d.aiSuggestions.forEach(function(x){o.push("- ("+fmtDate(x.t)+", "+x.src+") "+x.s);}); }
    o.push(""); o.push("## "+L.mdQuestions);
    if(d.questions.length) d.questions.forEach(function(x){o.push("- "+x.s);}); else o.push("- "+L.mdNone);
    o.push(""); o.push("## "+L.mdSources);
    d.sources.forEach(function(s){o.push("- "+s.date+" · "+s.src+" · "+s.title);});
    return o.join("\n");
  }
  function applyTemplate(body,topicName,summary){
    return String(body).replace(/\{\{\s*(TOPIC|TEMA|TÉMA)\s*\}\}/gi,topicName).replace(/\{\{\s*(SUMMARY|OSSZEFOGLALO|ÖSSZEFOGLALÓ)\s*\}\}/gi,summary);
  }
  function redact(text,opts){
    var names=!(opts&&opts.names===false);
    var n=0, t=String(text||"");
    function sub(re,rep){ t=t.replace(re,function(){n++;return rep;}); }
    sub(/[\w.+-]+@[\w-]+\.[\w.]+/g,"[e-mail]");
    sub(/https?:\/\/\S+|\bwww\.\S+/gi,"[link]");
    sub(/(^|\s)@[A-Za-z0-9_.]{2,}/g,"$1[@]");
    sub(/\b[A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){3,7}\b/g,"[IBAN]");
    sub(/\b(?:\d[ -]?){13,19}\b/g,"[szám]");
    sub(/\+?\d[\d\s().-]{7,}\d/g,"[telefon]");
    sub(/\b[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}\b/g,"[irányítószám]");
    sub(/(?:\b\d{1,4}[a-z]?\s+)?\b[\p{Lu}][\p{Ll}]+(?:\s+[\p{Lu}][\p{Ll}]+)*\s+(?:[Uu]tca|[Úú]t|[Úú]tja|[Tt]ér|[Kk]örút|[Kk]öz|[Ss]or|[Ss]treet|[Ss]t|[Rr]oad|[Rr]d|[Aa]venue|[Aa]ve|[Ll]ane|[Pp]lace|[Cc]lose|[Dd]rive|[Ww]ay)\b\.?(?:\s*\d+[a-z]?\.?)?/gu,"[cím]");
    sub(/\b\d{4}\s+[A-ZÁÉÍÓÖŐÚÜŰ][a-záéíóöőúüű]+/g,"[cím]");
    sub(/\b\d{6,}\b/g,"[azonosító]");
    // two or more capitalised words inside a sentence: likely a person's name

<script>
/* ---------- Minimal ZIP reader: runs fully in the browser, no library, no network ---------- */
async function readZip(file){
  var buf=new Uint8Array(await file.arrayBuffer());
  var dv=new DataView(buf.buffer);
  var eocd=-1;
  for(var i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error("zip");
  var count=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);
  var p=cdOff, entries=[];
  for(var n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    var method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    var nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(buf.subarray(p+46,p+46+nl));
    entries.push({name:name,method:method,csize:csize,lho:lho});
    p+=46+nl+el+cl;
  }
  return {
    entries:entries,
    read:async function(e){
      var lnl=dv.getUint16(e.lho+26,true), lel=dv.getUint16(e.lho+28,true);
      var start=e.lho+30+lnl+lel, data=buf.subarray(start,start+e.csize);
      if(e.method===0) return new TextDecoder().decode(data);
      if(e.method!==8) throw new Error("method");
      var ds=new DecompressionStream("deflate-raw");
      var out=new Blob([data]).stream().pipeThrough(ds);
      return await new Response(out).text();
    }
  };
}

function renderPackView(){

  var tags={now:L().lgNow,dec:L().lgDec,ai:L().lgAi,q:L().lgQ,goal:L().lgGoal};
  var secs=[{cls:"intro",head:"",lines:[]}];
  ta.value.split("\n").forEach(function(ln){
    var h=ln.match(/^##\s+(.*)/);
    if(h){secs.push({cls:map[h[1].trim()]||"intro",head:h[1].trim(),lines:[]});return;}
    secs[secs.length-1].lines.push(ln);
  });

async function readAny(files,texts){
  var found=[];
  for(var f of Array.from(files||[])){
    $("status").textContent=L().reading.replace("{name}",f.name);
    if(/\.json$/i.test(f.name)){
      var raw=await f.text(), pj=null; try{pj=JSON.parse(raw);}catch(e){}
      if(pj&&Array.isArray(pj.data_files)&&/export_url/.test(raw)) throw {msg:L().errManifest};
      if(pj){ try{found=found.concat(Core.parseJSON(f.name,pj));}catch(e){found=found.concat(Core.parseText(raw,L().pastedSrc));} }
      else found=found.concat(Core.parseText(raw,L().pastedSrc));
      continue;
    }
    if(/\.(txt|md)$/i.test(f.name)){ found=found.concat(Core.parseText(await f.text(),L().pastedSrc)); continue; }
    if(!("DecompressionStream" in window)) throw {msg:L().errOld};
    var z; try{ z=await readZip(f); }catch(e){ throw {msg:L().errZip}; }
    for(var e of z.entries){
      if(/\.json$/i.test(e.name)&&!/(^|\/)(memories|projects|users|design_chats|frames|artifact_data|light_metadata)[^\/]*\.json$/i.test(e.name)){
        try{ found=found.concat(Core.parseJSON(e.name,JSON.parse(await z.read(e)))); }catch(err){}
      }
    }
  }
  (texts||[]).forEach(function(t){
    var trimmed=t.trim();
    if(/^[\[{]/.test(trimmed)){ try{ found=found.concat(Core.parseJSON("paste",JSON.parse(trimmed))); return; }catch(e){} }
    found=found.concat(Core.parseText(trimmed,L().pastedSrc));
  });
  return found;
}

async function ingest(files,texts){
  var st=$("status");st.className="status";
  // one batch per file and per pasted text, so each can be removed on its own
  var jobs=Array.from(files||[]).map(function(f){return {label:f.name,files:[f],texts:[]};})
    .concat((texts||[]).map(function(t){return {label:L().pastedLabel,files:[],texts:[t]};}));
  var totalAdded=0,lastErr=null;

    if(!found.length){ lastErr=L().errNone; continue; }
    if(S.sample){ S.chats=[]; S.sample=false; }

  if(b.dataset.fkind){S.fkind=b.dataset.fkind;renderStatic();return;}
  if(b.id==="moreYes"){var pb=$("pasteBox");$("status").className="status";$("status").textContent=L().moreHint;pb.focus();if(pb.scrollIntoView)pb.scrollIntoView({behavior:"smooth",block:"center"});return;}
  if(b.id==="moreNo"){S.batches=[];renderMore();var s3=$("s3");if(s3.scrollIntoView)s3.scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(b.id==="ideaOpenBtn"){S.ideaFor=S.sel;var tt=topicById(S.sel);if(tt){renderIdeaPanel(tt);var ip=$("ideaPanel");if(ip.scrollIntoView)ip.scrollIntoView({behavior:"smooth",block:"start"});}return;}
  if(b.id==="ideaCancel"){S.ideaFor=null;$("ideaPanel").innerHTML="";return;}
  if(b.dataset.merge){var p=b.dataset.merge.split("|"),A=topicById(p[0]),B=topicById(p[1]);if(A&&B){A.ids=A.ids.concat(B.ids);S.topics=S.topics.filter(function(t){return t!==B;});S.sel=A.id;}renderResults();return;}
  if(b.dataset.nomerge){S.dismissed.add(b.dataset.nomerge);renderResults();return;}
  if(b.dataset.kind){S.ckind=b.dataset.kind;renderStatic();renderCommunity();return;}
  if(b.dataset.use){S.tpl=b.dataset.use;S.tab="main";renderStatic();renderDetail();renderCommunity();var d2=$("detail");if(d2.scrollIntoView)d2.scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(b.dataset.like){toggleLike(b.dataset.like);return;}
  if(b.dataset.del){delPost(b.dataset.del);return;}
  if(b.id==="copyBtn"){var ta=$("pack");try{await navigator.clipboard.writeText(ta.value);$("toast").textContent=L().copied;}catch(e){ta.focus();ta.select();$("toast").textContent=L().copyFail;}return;}
  if(b.id==="saveBtn"){var t=topicById(S.sel);try{await S.dl.save({filename:slug(t.name)+".md",data:$("pack").value});$("toast").textContent=L().saved;}catch(e){}return;}
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.id==="file"){if(el.files.length)ingest(el.files,[]);el.value="";return;}
  if(el.dataset&&el.dataset.move!=null&&el.value){
    var i=+el.dataset.move,from=topicById(el.dataset.from),to=topicById(el.value);
    if(from&&to){from.ids=from.ids.filter(function(x){return x!==i;});to.ids.push(i);if(!from.ids.length)S.topics=S.topics.filter(function(t){return t!==from;});}
    renderResults();
  }
});
document.addEventListener("input",function(ev){
  if(ev.target.id==="pack"){var tp=topicById(S.sel);if(tp)S.packEdit[tp.id]=ev.target.value;renderPackView();return;}
  if(ev.target.id==="goal"){var tg=topicById(S.sel);if(tg){S.goals[tg.id]=ev.target.value;delete S.packEdit[tg.id];setPack(packFor(tg).text);
    document.querySelectorAll("#goalPills .pill").forEach(function(b,i){b.setAttribute("aria-pressed",S._gs&&S._gs[i]&&S._gs[i].text===ev.target.value);});}return;}
  if(ev.target.id==="rename"){var t=topicById(S.sel);if(t){t.name=ev.target.value||t.name;delete S.packEdit[t.id];setPack(packFor(t).text);
    var lb=document.querySelector("[data-topic='"+t.id+"'] .lbl");if(lb)lb.textContent=t.name;}}
});
$("pasteBox").addEventListener("paste",function(e){
  var cd=e.clipboardData;if(!cd)return;
  if(cd.files&&cd.files.length){e.preventDefault();ingest(cd.files,[]);return;}
  var txt=cd.getData("text");if(txt){e.preventDefault();ingest([],[txt]);$("pasteBox").value="";}
});
$("pasteBox").addEventListener("blur",function(){var v=$("pasteBox").value;if(v.trim().length>=20){ingest([],[v]);$("pasteBox").value="";}});
document.addEventListener("paste",function(e){
  var t=e.target;if(t&&(t.id==="pasteBox"||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
  var cd=e.clipboardData;if(!cd)return;
  if(cd.files&&cd.files.length){e.preventDefault();ingest(cd.files,[]);}else{var txt=cd.getData("text");if(txt&&txt.trim().length>=20){e.preventDefault();ingest([],[txt]);}}
});
var drop=$("drop");
["dragenter","dragover"].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add("over");});});
["dragleave","drop"].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove("over");});});
drop.addEventListener("drop",function(e){var dt=e.dataTransfer;if(!dt)return;if(dt.files.length)ingest(dt.files,[]);else{var tx=dt.getData("text");if(tx)ingest([],[tx]);}});
window.addEventListener("dragover",function(e){e.preventDefault();});
window.addEventListener("drop",function(e){e.preventDefault();});

/* ---------- Community: only what people type is ever stored ---------- */
$("shareForm").addEventListener("submit",async function(ev){
  ev.preventDefault();var st=$("fStatus");st.className="status err";
  var kind=S.fkind,title=$("fTitle").value.trim(),body=$("fBody").value.trim();
  if(!title||!body){st.textContent=L().fNeedText;return;}
  if(!$("fOk").checked){st.textContent=L().fNeedOk;return;}
  if(Core.hasPersonal(title+" "+body)||Core.redact(title+"\n"+body,{names:false}).count){st.textContent=L().fPersonal;return;}
  if(kind==="prompt"&&!/\{\{\s*(SUMMARY|OSSZEFOGLALO|ÖSSZEFOGLALÓ)\s*\}\}/i.test(body)){st.textContent=L().fNeedSummary;return;}
  if(!S.db||!S.uid||S.canWrite===false){st.textContent=L().fNoWrite;return;}
  $("fSend").disabled=true;
  try{
    await S.db.collection("posts").add({kind:kind,lang:S.lang,title:title.slice(0,70),body:body.slice(0,1500),by:S.uid,at:Date.now()});
    $("fTitle").value="";$("fBody").value="";$("fOk").checked=false;st.className="status";st.textContent=L().fSent;S.ckind=kind;renderStatic();renderCommunity();
  }catch(e){ if(e&&e.code==="invalid_argument"){S.canWrite=false;st.textContent=L().fNoWrite;} else st.textContent=L().fErr; }
  $("fSend").disabled=false;
});
document.addEventListener("submit",async function(ev){
  if(ev.target.id!=="ideaForm")return; ev.preventDefault();
  var st=$("ideaStatus"),title=$("ideaTitle").value.trim(),body=$("ideaBody").value.trim();
  if(!title||!body){st.textContent=L().fNeedText;return;}
  if(!$("ideaOk").checked){st.textContent=L().fNeedOk;return;}
  if(Core.redact(title+"\n"+body,{names:false}).count||Core.hasPersonal(title+" "+body)){$("ideaTitle").value=Core.redact(title).text;$("ideaBody").value=Core.redact(body).text;st.textContent=L().fPersonal;return;}
  if(!S.db||!S.uid||S.canWrite===false){st.textContent=L().fNoWrite;return;}
  try{
    await S.db.collection("posts").add({kind:"idea",lang:S.lang,title:title.slice(0,70),body:body.slice(0,1500),by:S.uid,at:Date.now()});
    S.ideaFor=null;$("ideaPanel").innerHTML="";$("toast").textContent=L().ideaSent;S.ckind="idea";renderStatic();renderCommunity();
  }catch(e){st.textContent=(e&&e.code==="invalid_argument")?L().fNoWrite:L().fErr;}
});
var likeBusy=false;
async function toggleLike(id){
  if(!S.db||!S.uid||likeBusy)return;likeBusy=true;
  var next=S.myVotes.indexOf(id)>=0?S.myVotes.filter(function(x){return x!==id;}):S.myVotes.concat([id]);
  try{await S.db.doc("votes/"+S.uid).set({ids:next.slice(0,500)});}catch(e){}
  likeBusy=false;
}
async function delPost(id){if(!S.db)return;try{await S.db.doc("posts/"+id).delete();}catch(e){}}
async function initCapabilities(){
  if(!window.claude||!window.claude.use){S.dbState="off";renderCommunity();return;}
  try{S.dl=await window.claude.use("downloads");}catch(e){S.dl=null;}
  if(S.dl)renderDetail();
  var user=null;try{user=await window.claude.use("user");}catch(e){}
  if(user){try{S.uid=await user.id();}catch(e){}try{S.canWrite=await user.can("data.write");}catch(e){}}
  var db=null;try{db=await window.claude.use("db");}catch(e){}
  if(!db){S.dbState="off";renderCommunity();return;}
  S.db=db;S.dbState="on";renderDetail();
  db.collection("posts").orderBy("at","desc").limit(300).onSnapshot(function(snap){
    S.posts=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,kind:x.kind==="tip"?"tip":x.kind==="idea"?"idea":"prompt",lang:x.lang==="en"?"en":"hu",title:String(x.title||"").slice(0,70),body:String(x.body||"").slice(0,1500),by:x.by};});
    renderCommunity();if(!document.activeElement||document.activeElement.closest&&!document.activeElement.closest("#detail"))renderDetail();
  },function(){S.dbState="off";renderCommunity();});
  db.collection("votes").limit(1000).onSnapshot(function(snap){
    var v={};snap.docs.forEach(function(d){var x=d.data()||{};v[d.id]=Array.isArray(x.ids)?x.ids.map(String):[];});
    S.votes=v;S.myVotes=(S.uid&&v[S.uid])||[];renderCommunity();
  },function(){});
  renderCommunity();
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&S.share)closeShare();});
regroup();renderAll();initCapabilities();
</script>
